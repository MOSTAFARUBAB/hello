name: Build Simple Waypoints (Minecraft 26.3)

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'

      - name: Build Simple Waypoints mod
        run: gradle clean build --no-daemon

      - name: Inspect build outputs
        if: always()
        shell: bash
        run: |
          echo "Build output directory:"
          if [ -d build/libs ]; then
            find build/libs -maxdepth 1 -type f -printf '%f (%s bytes)\n' | sort
          else
            echo "build/libs was not created"
          fi

      - name: Verify installable mod JAR
        shell: bash
        run: |
          set -euo pipefail
          MOD_JAR="$(find build/libs -maxdepth 1 -type f -name 'simple-waypoints-*.jar' ! -name '*-sources.jar' -print -quit)"
          if [ -z "$MOD_JAR" ]; then
            echo "ERROR: No installable mod JAR was found."
            exit 1
          fi
          if ! jar tf "$MOD_JAR" | grep -qx 'fabric.mod.json'; then
            echo "ERROR: $MOD_JAR does not contain fabric.mod.json."
            exit 1
          fi
          echo "Verified installable mod JAR: $MOD_JAR"

      - name: Upload installable mod JAR only
        uses: actions/upload-artifact@v4
        with:
          name: simple-waypoints-mc-26.3
          path: |
            build/libs/simple-waypoints-*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
          compression-level: 0
